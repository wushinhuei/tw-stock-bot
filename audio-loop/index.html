<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="上傳常見音訊格式，選取片段無縫重複播放並輸出 MP3。">
  <meta name="theme-color" content="#f5efe5">
  <script>
    if (window.location.protocol === "file:") {
      window.location.replace("https://wushinhuei.github.io/tw-stock-bot/audio-loop/?source=local-file");
    }
  </script>
  <title>音樂循環撥放工具</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="shell">
    <header class="hero">
      <h1>音樂循環撥放工具</h1>
    </header>

    <section class="studio" aria-labelledby="studio-title">
      <div class="step-heading">
        <span>01</span>
        <div>
          <h2 id="studio-title">選擇音檔</h2>
          <p>支援 MP3、WAV、M4A、AAC、OGG、FLAC 與 WebM</p>
        </div>
      </div>

      <label class="drop-zone" id="drop-zone" for="audio-file">
        <input id="audio-file" type="file" accept="audio/*,.m4a,.aac,.flac,.oga">
        <span class="upload-mark" aria-hidden="true">＋</span>
        <span class="drop-title">點一下選擇，或將音檔拖到這裡</span>
        <span class="drop-note">請使用 HTTPS 網頁操作，檔案不會離開瀏覽器</span>
      </label>

      <div class="file-card" id="file-card" hidden>
        <div class="record-dot" aria-hidden="true"></div>
        <div class="file-copy">
          <strong id="file-name"></strong>
          <span id="file-meta"></span>
        </div>
        <button class="text-button" id="replace-file" type="button">更換</button>
      </div>

      <div class="editor" id="editor" hidden>
        <div class="step-heading second-step">
          <span>02</span>
          <div>
            <h2>設定循環片段</h2>
            <p>拖曳起點與終點，至少保留 3 秒</p>
          </div>
        </div>

        <div class="wave-wrap">
          <canvas id="waveform" height="180" aria-label="音訊波形與循環範圍"></canvas>
          <div class="range-track" aria-hidden="true">
            <div id="range-fill"></div>
          </div>
          <input class="range range-start" id="loop-start" type="range" min="0" max="100" step="0.01" value="0" aria-label="循環起點">
          <input class="range range-end" id="loop-end" type="range" min="0" max="100" step="0.01" value="100" aria-label="循環終點">
        </div>

        <div class="time-grid">
          <label>
            <span>開始於</span>
            <input id="start-time" inputmode="decimal" value="00:00.0" aria-label="循環開始時間">
          </label>
          <div class="segment-duration">
            <span>片段長度</span>
            <strong id="segment-duration">00:00.0</strong>
          </div>
          <label>
            <span>結束於</span>
            <input id="end-time" inputmode="decimal" value="00:00.0" aria-label="循環結束時間">
          </label>
        </div>

        <div class="step-heading third-step">
          <span>03</span>
          <div>
            <h2>決定播放時間</h2>
            <p>最長可設定 4 小時</p>
          </div>
        </div>

        <div class="duration-row">
          <label><span>小時</span><input id="hours" type="number" min="0" max="4" value="0"></label>
          <b>:</b>
          <label><span>分鐘</span><input id="minutes" type="number" min="0" max="59" value="30"></label>
          <b>:</b>
          <label><span>秒</span><input id="seconds" type="number" min="0" max="59" value="0"></label>
        </div>

        <div class="player-panel">
          <div class="status-line">
            <span id="status">準備完成</span>
            <span id="remaining">30:00</span>
          </div>
          <div class="progress" aria-hidden="true"><div id="progress-bar"></div></div>
          <button class="play-button" id="play" type="button">
            <span class="play-icon" aria-hidden="true"></span>
            <span id="play-label">開始無縫播放</span>
          </button>
          <p class="seamless-note"><span aria-hidden="true">≈</span> 系統會自動交叉淡化循環接點，讓轉場更自然</p>
        </div>

        <div class="export-panel">
          <div class="export-copy">
            <strong>輸出 MP3</strong>
            <span id="export-estimate">預估檔案大小約 41 MB</span>
          </div>
          <div class="export-progress" id="export-progress" hidden aria-hidden="true"><div id="export-progress-bar"></div></div>
          <button class="export-button" id="export" type="button">
            <span aria-hidden="true">↓</span>
            <span id="export-label">產生並下載 MP3</span>
          </button>
          <p class="export-note">第一次轉檔會載入約 31 MB 的轉檔元件；音檔越長，處理時間越久。</p>
        </div>
      </div>

      <p class="message" id="message" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer>所有處理皆在本機完成 · 輸出為 MP3 192 kbps · Powered by FFmpeg.wasm</footer>
  <script type="module" src="app.mjs"></script>
</body>
</html>

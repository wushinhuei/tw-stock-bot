steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - tw-stock-dashboard-api
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/src/main.js
      - --set-env-vars=RUN_MODE=api,SIMULATION_ENV=staging,GCS_BUCKET=${_GCS_BUCKET},DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --allow-unauthenticated
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    secretEnv: ['GITHUB_STATIC_BACKUP_TOKEN']
    args:
      - run
      - jobs
      - deploy
      - tw-stock-simulator
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-env-vars=SIMULATION_ENV=staging,GCS_BUCKET=${_GCS_BUCKET},RUN_MODE=tick,CANDIDATE_SNAPSHOT_URL=${_CANDIDATE_SNAPSHOT_URL},DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,MOPS_SOURCE_POLICY=MOPS_MCP_PRIMARY,TWSE_DRIVE_SYNC=1,TWSE_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MOPS_DRIVE_PARENT_FOLDER_ID=${_MOPS_DRIVE_PARENT_FOLDER_ID},MCP_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},STATIC_BACKUP_ON_TRADE=1,GITHUB_STATIC_BACKUP_REPOSITORY=wushinhuei/tw-stock-bot,GITHUB_STATIC_BACKUP_WORKFLOW=update-static-dashboard.yml,GITHUB_STATIC_BACKUP_REF=main,STATIC_BACKUP_COOLDOWN_MS=120000,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --update-secrets=GITHUB_STATIC_BACKUP_TOKEN=github-static-backup-token:latest
      - --tasks=1
      - --max-retries=0
      - --task-timeout=55s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-pretrade-prepare
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/src/pretrade_prepare_job.js
      - --set-env-vars=SIMULATION_ENV=staging,GCS_BUCKET=${_GCS_BUCKET},CANDIDATE_SNAPSHOT_URL=${_CANDIDATE_SNAPSHOT_URL},DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,MOPS_SOURCE_POLICY=MOPS_MCP_PRIMARY,TWSE_DRIVE_SYNC=1,TWSE_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MOPS_DRIVE_PARENT_FOLDER_ID=${_MOPS_DRIVE_PARENT_FOLDER_ID},MCP_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=1
      - --task-timeout=1200s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-twse-drive-sync
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/scripts/sync_twse_mcp_to_drive.js
      - --set-env-vars=DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,GCS_BUCKET=${_GCS_BUCKET},TWSE_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},TWSE_DRIVE_FOLDER_NAME=TWSE_MCP_PRIMARY,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=1
      - --task-timeout=1200s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-mops-drive-sync
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/scripts/sync_mops_mcp_to_drive.js
      - --set-env-vars=DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,MOPS_SOURCE_POLICY=MOPS_MCP_PRIMARY,GCS_BUCKET=${_GCS_BUCKET},TWSE_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MOPS_DRIVE_PARENT_FOLDER_ID=${_MOPS_DRIVE_PARENT_FOLDER_ID},MOPS_DRIVE_FOLDER_NAME=MOPS_MCP_PRIMARY,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=1
      - --task-timeout=1800s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-mops-20q-backfill
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/scripts/backfill_mops_20q_to_drive.js
      - --set-env-vars=DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,MOPS_SOURCE_POLICY=MOPS_MCP_PRIMARY,GCS_BUCKET=${_GCS_BUCKET},MOPS_20Q_COUNT=20,MOPS_20Q_DRIVE_PARENT_FOLDER_ID=${_MOPS_20Q_DRIVE_PARENT_FOLDER_ID},MOPS_20Q_DRIVE_FOLDER_NAME=20Q_MCP_PRIMARY,NODE_OPTIONS=--max-old-space-size=3072,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=0
      - --task-timeout=7200s
      - --cpu=2
      - --memory=4Gi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-mcp-daily-sync
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/scripts/sync_all_mcp_to_drive.js
      - --set-env-vars=DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,GCS_BUCKET=${_GCS_BUCKET},TWSE_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MOPS_DRIVE_PARENT_FOLDER_ID=${_MOPS_DRIVE_PARENT_FOLDER_ID},MCP_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MCP_DRIVE_AUDIT_FOLDER_NAME=MCP_DAILY_SYNC_AUDIT,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=1
      - --task-timeout=2400s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-growth-top10-sync
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/scripts/sync_growth_candidates_to_drive.js
      - --set-env-vars=DATA_SOURCE_POLICY=MCP_FIRST_DAILY_DRIVE_PERSISTENCE,MOPS_SOURCE_POLICY=MOPS_MCP_PRIMARY,GCS_BUCKET=${_GCS_BUCKET},GROWTH_DRIVE_PARENT_FOLDER_ID=${_MOPS_DRIVE_PARENT_FOLDER_ID},GROWTH_DRIVE_FOLDER_NAME=GROWTH_CANDIDATES_TOP10,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=1
      - --task-timeout=2400s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - tw-stock-data-health
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --command=node
      - --args=cloud_simulator/scripts/check_all_data_health.js
      - --set-env-vars=GCS_BUCKET=${_GCS_BUCKET},TWSE_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MOPS_DRIVE_PARENT_FOLDER_ID=${_MOPS_DRIVE_PARENT_FOLDER_ID},MCP_DRIVE_PARENT_FOLDER_ID=${_TWSE_DRIVE_PARENT_FOLDER_ID},MOPS_20Q_DRIVE_PARENT_FOLDER_ID=${_MOPS_20Q_DRIVE_PARENT_FOLDER_ID},MCP_DRIVE_AUDIT_FOLDER_NAME=MCP_DAILY_SYNC_AUDIT,GROWTH_DRIVE_FOLDER_NAME=GROWTH_CANDIDATES_TOP10,DATA_HEALTH_DRIVE_FOLDER_NAME=DATA_HEALTH_AUDIT,DEPLOY_COMMIT_SHA=$COMMIT_SHA
      - --tasks=1
      - --max-retries=1
      - --task-timeout=900s
      - --cpu=1
      - --memory=512Mi

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        upsert_scheduler() {
          NAME="$$1"
          SCHEDULE="$$2"
          URI="$$3"
          if gcloud scheduler jobs describe "$$NAME" --location="${_REGION}" >/dev/null 2>&1; then
            gcloud scheduler jobs update http "$$NAME" --location="${_REGION}" --schedule="$$SCHEDULE" --time-zone="Asia/Taipei" --uri="$$URI" --http-method=POST --oauth-service-account-email="${_RUNTIME_SERVICE_ACCOUNT}" --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          else
            gcloud scheduler jobs create http "$$NAME" --location="${_REGION}" --schedule="$$SCHEDULE" --time-zone="Asia/Taipei" --uri="$$URI" --http-method=POST --oauth-service-account-email="${_RUNTIME_SERVICE_ACCOUNT}" --oauth-token-scope="https://www.googleapis.com/auth/cloud-platform"
          fi
        }
        PREP_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/tw-stock-pretrade-prepare:run"
        TWSE_SYNC_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/tw-stock-twse-drive-sync:run"
        MOPS_SYNC_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/tw-stock-mops-drive-sync:run"
        MCP_DAILY_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/tw-stock-mcp-daily-sync:run"
        GROWTH_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/tw-stock-growth-top10-sync:run"
        HEALTH_URI="https://run.googleapis.com/v2/projects/$PROJECT_ID/locations/${_REGION}/jobs/tw-stock-data-health:run"
        upsert_scheduler tw-stock-pretrade-after-close '0 14 * * 1-5' "$$PREP_URI"
        upsert_scheduler tw-stock-pretrade-0800 '0 8 * * 1-5' "$$PREP_URI"
        upsert_scheduler tw-stock-twse-drive-sync-after-close '5 14 * * 1-5' "$$TWSE_SYNC_URI"
        upsert_scheduler tw-stock-mops-drive-sync-evening '30 20 * * 1-5' "$$MOPS_SYNC_URI"
        upsert_scheduler tw-stock-mcp-daily-sync-evening '45 20 * * 1-5' "$$MCP_DAILY_URI"
        upsert_scheduler tw-stock-growth-top10-evening '0 21 * * 1-5' "$$GROWTH_URI"
        upsert_scheduler tw-stock-data-health-evening '15 21 * * 1-5' "$$HEALTH_URI"

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: bash
    args:
      - -ceu
      - |
        EXPECTED_IMAGE="${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA"
        SERVICE_IMAGE="$$(gcloud run services describe tw-stock-dashboard-api --region="${_REGION}" --format='value(spec.template.spec.containers[0].image)')"
        echo "tw-stock-dashboard-api -> $$SERVICE_IMAGE"
        test "$$SERVICE_IMAGE" = "$$EXPECTED_IMAGE"
        for JOB in tw-stock-simulator tw-stock-pretrade-prepare tw-stock-twse-drive-sync tw-stock-mops-drive-sync tw-stock-mops-20q-backfill tw-stock-mcp-daily-sync tw-stock-growth-top10-sync tw-stock-data-health; do
          IMAGE="$$(gcloud run jobs describe "$$JOB" --region="${_REGION}" --format='value(spec.template.spec.template.spec.containers[0].image)')"
          echo "$$JOB -> $$IMAGE"
          test "$$IMAGE" = "$$EXPECTED_IMAGE"
        done
        for SCHEDULER in tw-stock-pretrade-after-close tw-stock-pretrade-0800 tw-stock-twse-drive-sync-after-close tw-stock-mops-drive-sync-evening tw-stock-mcp-daily-sync-evening tw-stock-growth-top10-evening tw-stock-data-health-evening; do
          STATE="$$(gcloud scheduler jobs describe "$$SCHEDULER" --location="${_REGION}" --format='value(state)')"
          echo "$$SCHEDULER -> $$STATE"
          test "$$STATE" = "ENABLED"
        done
        echo "Verified Cloud Run service, jobs and schedulers at commit $COMMIT_SHA"

substitutions:
  _REGION: asia-east1
  _REPOSITORY: tw-stock
  _GCS_BUCKET: project-aef205b5-5c27-4084-94c-tw-stock-data
  _RUNTIME_SERVICE_ACCOUNT: tw-stock-runtime@project-aef205b5-5c27-4084-94c.iam.gserviceaccount.com
  _CANDIDATE_SNAPSHOT_URL: 'https://script.google.com/macros/s/AKfycbxMSe1WvXNjTbAzxZSP8mD_9wt11BIGQSyaFTktoet_v7WQ1KujUu19pflwS6zHfhqt/exec?action=refresh&force=1'
  _TWSE_DRIVE_PARENT_FOLDER_ID: '1K0pAhcPJLxTZ7dIjlTrMFcqUr30gBl35'
  _MOPS_DRIVE_PARENT_FOLDER_ID: '1K0pAhcPJLxTZ7dIjlTrMFcqUr30gBl35'
  _MOPS_20Q_DRIVE_PARENT_FOLDER_ID: '1oNlmeY46SpjBoZCUUlLCGGu8AV1W-knd'

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/github-static-backup-token/versions/latest
      env: GITHUB_STATIC_BACKUP_TOKEN

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPOSITORY}/tw-stock-simulator:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY

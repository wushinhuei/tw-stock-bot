<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台股策略系統</title>
  <link rel="stylesheet" href="styles.css?v=202608211200">
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <p class="eyebrow">Paper Trading · TAIEX</p>
        <h1>台股策略系統</h1>
      </div>
      <div class="actions">
        <a class="icon-link" id="settingsLink" href="#" target="_blank" rel="noreferrer" title="開啟策略設定表">設定表</a>
        <button id="refreshButton" type="button" title="更新資料">更新資料</button>
      </div>
    </section>

    <section class="status-strip" aria-live="polite">
      <div>
        <span>資料狀態</span>
        <strong id="sourceStatus">初始化</strong>
      </div>
      <div>
        <span>最後更新</span>
        <strong id="lastUpdated">--</strong>
      </div>
      <div>
        <span>交易簽名</span>
        <strong id="tradeSignature">--</strong>
      </div>
    </section>

    <section class="dashboard-grid">
      <article class="metric primary">
        <span>總資產</span>
        <strong id="equity">--</strong>
        <small id="returnLine">--</small>
      </article>
      <article class="metric">
        <span>現金</span>
        <strong id="cash">--</strong>
        <small id="cashReserve">--</small>
      </article>
      <article class="metric">
        <span>今日損益</span>
        <strong id="dailyPnl">--</strong>
        <small id="targetLine">月目標 3% - 5%</small>
      </article>
      <article class="metric">
        <span>風控</span>
        <strong id="riskStatus">--</strong>
        <small id="riskMessage">--</small>
      </article>
    </section>

    <section class="market-panel">
      <div>
        <h2>市場溫度</h2>
        <p id="marketSummary">--</p>
      </div>
      <div class="market-bars" id="marketBars"></div>
    </section>

    <section class="two-col">
      <article>
        <div class="section-head">
          <h2>候選股</h2>
          <span id="candidateCount">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>代號</th>
                <th>族群</th>
                <th>評級</th>
                <th>價格</th>
                <th>分數</th>
                <th>原因</th>
              </tr>
            </thead>
            <tbody id="candidatesBody"></tbody>
          </table>
        </div>
      </article>

      <article>
        <div class="section-head">
          <h2>持倉</h2>
          <span id="positionCount">0</span>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>代號</th>
                <th>股數</th>
                <th>成本</th>
                <th>現價</th>
                <th>損益</th>
                <th>計畫</th>
              </tr>
            </thead>
            <tbody id="positionsBody"></tbody>
          </table>
        </div>
      </article>
    </section>

    <section class="two-col">
      <article>
        <div class="section-head">
          <h2>交易紀錄</h2>
          <span id="tradeCount">0</span>
        </div>
        <ol class="timeline" id="tradesList"></ol>
      </article>
      <article>
        <div class="section-head">
          <h2>檢討</h2>
        </div>
        <div class="review">
          <p id="weeklyReport">--</p>
          <p id="thirtyDayReport">--</p>
        </div>
      </article>
    </section>
  </main>

  <script src="apps_script_config.js?v=202608211200"></script>
  <script src="actual_data.js?v=202608211200"></script>
  <script src="simulation_result.js?v=202608211200"></script>
  <script src="app.js?v=202608211200"></script>
</body>
</html>

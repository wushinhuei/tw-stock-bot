name: Daily Taiwan Stock Simulation

on:
  workflow_dispatch:
  schedule:
    # Taiwan regular session, every 5 minutes from 09:00 to 13:55 Asia/Taipei.
    - cron: "*/5 1-5 * * 1-5"
    # After close snapshot at 15:20 Asia/Taipei.
    - cron: "20 7 * * 1-5"

permissions:
  contents: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Update market data
        run: node scripts/update_tw_data.js

      - name: Run daily simulation
        run: node scripts/run_tw_simulation.js

      - name: Commit updated simulation files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update daily Taiwan stock simulation"

      - name: Publish updated dashboard data to GitHub Pages branch
        run: git push origin HEAD:gh-pages
